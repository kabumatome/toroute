name: Scheduled live network test
on: {workflow_dispatch: {}}
permissions: {}
jobs:
  live:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: buildmeta
        run: echo "date=$(git show -s --format=%cI HEAD)" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          load: true
          platforms: linux/amd64
          tags: toroute:scheduled
          build-args: |
            VERSION=scheduled-${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.buildmeta.outputs.date }}
          cache-from: type=gha
      - name: Run live network and runtime benchmark
        env:
          LIVE_TIMEOUT_SECONDS: '360'
          LIVE_METRICS_OUTPUT: scheduled-runtime-metrics.json
          RUNTIME_SAMPLE_SECONDS: '10'
        run: ./scripts/live-smoke.sh toroute:scheduled
      - name: Upload scheduled runtime evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: scheduled-runtime-metrics.json
          if-no-files-found: error
          retention-days: 30
