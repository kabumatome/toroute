name: Bootstrap GHCR package
on: {workflow_dispatch: {}}
permissions: {}
concurrency: {group: bootstrap-ghcr, cancel-in-progress: false}
jobs:
  bootstrap:
    permissions: {contents: read, packages: write}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: 1.26.5, cache: true}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml shellcheck
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
      - name: Formatting
        run: make fmt
      - name: Go vet
        run: make vet
      - name: Race tests and coverage
        run: make test
      - name: Privacy and secret scan
        run: make privacy-scan
      - name: OCI, attestation, and vulnerability policy tests
        run: make policy-test
      - name: Runtime budget policy tests
        run: make runtime-budget-test
      - name: Release tooling tests
        run: make release-tools-test
      - name: Repository and workflow policy
        run: make repository-test
      - name: Native and Linux arm64 builds
        run: make validate-build
      - name: Actionlint
        run: actionlint
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - id: buildmeta
        run: echo "date=$(git show -s --format=%cI HEAD)" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - id: refs
        shell: bash
        run: echo "candidate=ghcr.io/${GITHUB_REPOSITORY,,}:bootstrap-${GITHUB_SHA}-${GITHUB_RUN_ID}" >>"$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.refs.outputs.candidate }}
          build-args: |
            VERSION=bootstrap-${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.buildmeta.outputs.date }}
            SOURCE=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate candidate index
        env: {IMAGE: '${{ steps.refs.outputs.candidate }}@${{ steps.build.outputs.digest }}'}
        run: |
          docker buildx imagetools inspect "$IMAGE" --raw >index.json
          mkdir -p bootstrap-evidence
          python3 scripts/manifest-identity.py <index.json >bootstrap-evidence/platforms.json
      - name: Extract and validate bootstrap SBOM and provenance
        env: {IMAGE: '${{ steps.refs.outputs.candidate }}@${{ steps.build.outputs.digest }}'}
        run: |
          set -Eeuo pipefail
          docker buildx imagetools inspect "$IMAGE" --format '{{ json (index .SBOM "linux/amd64").SPDX }}' >bootstrap-evidence/sbom-amd64.json
          docker buildx imagetools inspect "$IMAGE" --format '{{ json (index .SBOM "linux/arm64").SPDX }}' >bootstrap-evidence/sbom-arm64.json
          docker buildx imagetools inspect "$IMAGE" --format '{{ json (index .Provenance "linux/amd64").SLSA }}' >bootstrap-evidence/provenance-amd64.json
          docker buildx imagetools inspect "$IMAGE" --format '{{ json (index .Provenance "linux/arm64").SLSA }}' >bootstrap-evidence/provenance-arm64.json
          python3 scripts/validate-attestation-data.py \
            --sbom-amd64 bootstrap-evidence/sbom-amd64.json \
            --sbom-arm64 bootstrap-evidence/sbom-arm64.json \
            --provenance-amd64 bootstrap-evidence/provenance-amd64.json \
            --provenance-arm64 bootstrap-evidence/provenance-arm64.json \
            --summary bootstrap-evidence/attestation-summary.json
      - name: Validate amd64 candidate
        env: {DOCKER_PLATFORM: linux/amd64}
        run: ./scripts/docker-config-test.sh '${{ steps.refs.outputs.candidate }}@${{ steps.build.outputs.digest }}'
      - name: Record amd64 image footprint and package inventory
        env:
          IMAGE: ${{ steps.refs.outputs.candidate }}@${{ steps.build.outputs.digest }}
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: ./scripts/image-inventory.sh "$IMAGE" bootstrap-evidence/image-inventory-amd64.json
      - name: Validate arm64 candidate
        env: {DOCKER_PLATFORM: linux/arm64}
        run: ./scripts/docker-config-test.sh '${{ steps.refs.outputs.candidate }}@${{ steps.build.outputs.digest }}'
      - name: Validate amd64 live Tor paths and collect runtime metrics
        env:
          LIVE_TIMEOUT_SECONDS: '360'
          LIVE_METRICS_OUTPUT: bootstrap-evidence/runtime-metrics-amd64.json
          RUNTIME_SAMPLE_SECONDS: '10'
        run: ./scripts/live-smoke.sh '${{ steps.refs.outputs.candidate }}@${{ steps.build.outputs.digest }}'
      - name: Scan amd64 bootstrap candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: '${{ steps.refs.outputs.candidate }}@${{ steps.build.outputs.digest }}'
          format: json
          output: bootstrap-evidence/trivy-amd64.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          trivy-args: --platform linux/amd64
      - name: Scan arm64 bootstrap candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: '${{ steps.refs.outputs.candidate }}@${{ steps.build.outputs.digest }}'
          format: json
          output: bootstrap-evidence/trivy-arm64.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          trivy-args: --platform linux/arm64
      - name: Enforce bootstrap vulnerability policy
        run: |
          python3 scripts/check-vulnerabilities.py             --report linux/amd64=bootstrap-evidence/trivy-amd64.json             --report linux/arm64=bootstrap-evidence/trivy-arm64.json             --evidence bootstrap-evidence/vulnerability-policy.json
      - name: Upload bootstrap evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: bootstrap-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Next step
        run: echo 'Set the GHCR package visibility to Public, verify an anonymous pull, then create a release tag.'
